<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aodshieldos — Aodı Akdıro</title>
<style>
:root{
  --bg:#0b1020; --bg2:#0d1428; --card:#131b33; --card2:#0f172e;
  --text:#e9edfc; --muted:#92a0c6; --line:#202a4a;
  --accent:#7b6cff; --accent2:#2ad3a7; --warn:#f0b429; --danger:#ff6b7d;
  --mono:"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
}
html[data-theme="light"]{
  --bg:#f5f7fd; --bg2:#eef1f8; --card:#ffffff; --card2:#f8fafe;
  --text:#1a2142; --muted:#5c6a8e; --line:#dfe4f2;
  --accent:#6c5ce7; --accent2:#0ba57f; --warn:#b47e0a; --danger:#d94848;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg); color:var(--text); font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",Arial,sans-serif; line-height:1.65; min-height:100vh; padding-bottom:84px}
a{color:var(--accent); text-decoration:none}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit}
.wrap{max-width:1120px; margin:0 auto; padding:0 20px}

header{position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.hrow{display:flex; align-items:center; gap:14px; padding:12px 0}
.logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; white-space:nowrap}
.logo .mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:13px;font-weight:800;letter-spacing:.5px}
.logo small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.hbtn{padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:13px; font-weight:600}
.hbtn:hover{border-color:var(--accent); color:var(--accent)}
.hsearch{flex:1; min-width:150px}
.hsearch input{width:100%; padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:14px; outline:none}
.hsearch input:focus{border-color:var(--accent)}

.hero{padding:32px 0 6px; text-align:center}
.hero h1{font-size:clamp(22px,4vw,32px); font-weight:800; letter-spacing:-.5px; line-height:1.3}
.hero h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero p{color:var(--muted); margin-top:8px; font-size:14.5px}
.stats{display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap}
.stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 15px; font-size:13px; color:var(--muted)}
.stat b{color:var(--text); font-size:15px}

.tabs{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:20px 0 10px; position:sticky; top:62px; z-index:40; background:color-mix(in srgb, var(--bg) 94%, transparent); padding:8px 0; border-radius:0 0 14px 14px}
.tchip{display:flex; align-items:center; gap:7px; padding:8px 13px; border-radius:99px; border:1px solid var(--line); background:var(--card); font-size:13px; font-weight:700; color:var(--muted); transition:all .15s}
.tchip.on{color:#fff; border-color:transparent; background:var(--tc,var(--accent)); box-shadow:0 4px 14px -6px var(--tc,var(--accent))}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tc,var(--accent))}
.tchip.on .dot{background:#fff}

.sect{display:none; padding-bottom:30px}
.sect.on{display:block}
.bar{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0 16px; align-items:center}
.bchip{padding:6px 13px; font-size:12.5px; border-radius:99px; border:1px solid var(--line); background:var(--card2); color:var(--muted); font-weight:700}
.bchip.on{background:var(--ac,var(--accent)); border-color:transparent; color:#fff}
.notebox{max-width:860px; margin:0 auto 16px; background:color-mix(in srgb, var(--warn) 11%, var(--card)); border:1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius:12px; padding:12px 16px; font-size:13px}
.notebox b{color:var(--warn)}
.progwrap{max-width:860px; margin:0 auto 14px}
.prog{height:9px; border-radius:99px; background:var(--card2); border:1px solid var(--line); overflow:hidden}
.prog i{display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .3s}
.plabel{font-size:12px; color:var(--muted); margin-bottom:5px; display:flex; justify-content:space-between}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px; padding-bottom:30px}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px; display:flex; flex-direction:column; gap:9px; transition:transform .12s, border-color .12s}
.card.hov{cursor:pointer}
.card.hov:hover{transform:translateY(-2px); border-color:var(--accent)}
.top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.pid{font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--card2); border:1px solid var(--line); padding:2px 8px; border-radius:6px}
.badge{font-size:11px; font-weight:700; color:#fff; padding:3px 9px; border-radius:99px; white-space:nowrap}
.card h3{font-size:15px; font-weight:700; line-height:1.5}
.card p{font-size:13px; color:var(--muted)}
.foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px; border-top:1px dashed var(--line); font-size:12px; color:var(--muted)}
.empty{text-align:center; color:var(--muted); padding:60px 0; grid-column:1/-1}
.mini{font-size:11.5px; color:var(--muted)}
.ghostbtn{padding:6px 11px; border-radius:9px; border:1px solid var(--line); background:var(--card2); color:var(--muted); font-size:12px; font-weight:700}
.ghostbtn:hover{border-color:var(--accent); color:var(--accent)}

.tl{max-width:900px; margin:0 auto; border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:30px}
.tlrow{display:grid; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); align-items:center}
.tlrow:last-child{border-bottom:none}
.tlrow:nth-child(even){background:var(--card2)}
.tlhead{background:var(--bg2); font-weight:800; font-size:12px; color:var(--muted)}

.kanban{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; padding-bottom:30px}
.kcol{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px; min-height:110px}
.kcol h4{font-size:13px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center}
.kcol h4 .cnt{font-size:11px; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:99px; padding:1px 8px}
.kitem{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px}
.kmove{display:flex; gap:4px; margin-top:8px}
.kmove button{flex:1; font-size:11px; padding:4px 0; border-radius:7px; border:1px solid var(--line); background:var(--card2); color:var(--muted)}
.kmove button:hover{color:var(--accent2); border-color:var(--accent2)}

.anbox{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; max-width:760px; margin:0 auto 16px}
.anbox h3{font-size:15px; margin-bottom:12px}
.anbox .row{display:flex; gap:8px; align-items:center; margin:8px 0}
.anbox .row label{font-size:12.5px; color:var(--muted); width:170px; flex:none}
.anbox .row input{flex:1; padding:8px 11px; border-radius:9px; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:13px}
.anbox .row input:focus{border-color:var(--accent); outline:none}
.ares{margin-top:12px; padding:12px; border-radius:10px; background:color-mix(in srgb, var(--accent2) 10%, var(--card2)); border:1px solid color-mix(in srgb, var(--accent2) 35%, var(--line)); font-size:15px; font-weight:800}
.ares small{display:block; color:var(--muted); font-weight:600; font-size:11.5px; margin-top:3px}
.ckitem{display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border:1px solid var(--line); border-radius:11px; background:var(--card); margin-bottom:8px; max-width:860px; margin-inline:auto}
.ckitem input{width:18px; height:18px; accent-color:var(--accent2); margin-top:3px; flex:none}
.ckitem.done{opacity:.55}
.ckitem .txt{font-size:13.5px; flex:1}
.riskdot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}

.overlay{position:fixed; inset:0; background:rgba(4,10,22,.62); backdrop-filter:blur(4px); z-index:100; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:30px 16px}
.overlay.open{display:flex}
.modal{background:var(--card); border:1px solid var(--line); border-radius:16px; max-width:780px; width:100%; margin:auto; padding:24px; animation:up .18s ease}
@keyframes up{from{transform:translateY(14px); opacity:0} to{transform:none; opacity:1}}
.mhead{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px}
.mhead h2{font-size:18px; font-weight:800; line-height:1.4}
.x{background:var(--card2); border:1px solid var(--line); color:var(--muted); width:32px; height:32px; border-radius:9px; font-size:15px; flex:none}
.x:hover{color:var(--danger); border-color:var(--danger)}
.mtagrow{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px}
.mbadge{font-size:11px; font-weight:700; color:#fff; padding:2px 9px; border-radius:99px}
.sec{margin:14px 0}
.sec h4{font-size:13px; color:var(--accent); font-weight:800; margin-bottom:6px}
.sec .box{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:13.5px; white-space:pre-wrap}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.btn{padding:11px 18px; border-radius:11px; border:none; font-weight:800; font-size:14px; color:#fff; background:linear-gradient(135deg,var(--accent),#5b52d9); flex:1}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card2); color:var(--text); border:1px solid var(--line); flex:0 0 auto}
.formrow{display:flex; flex-direction:column; gap:4px; margin:10px 0}
.formrow label{font-size:12.5px; color:var(--muted); font-weight:700}
.formrow input,.formrow select,.formrow textarea{padding:9px 12px; border-radius:9px; border:1px solid var(--line); background:var(--card2); color:var(--text); font-size:13.5px}

footer{border-top:1px solid var(--line); background:var(--bg2); padding:26px 0; margin-top:20px}
.frow{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.fbrand{font-weight:800; font-size:14px}
.fbrand span{color:var(--muted); font-weight:600; font-size:12px; display:block}
.fcontact{display:flex; gap:14px; flex-wrap:wrap; font-size:13px}
.fcontact a{color:var(--muted)}
.fcontact a:hover{color:var(--accent)}
.fcopy{width:100%; text-align:center; color:var(--muted); font-size:12px; margin-top:14px}
.fcopy code{font-family:var(--mono); font-size:11px}

#quickbar{position:fixed; bottom:0; inset-inline:0; z-index:90; background:color-mix(in srgb, var(--bg) 96%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:10px 16px}
#quickbar .wrap{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.qbtn{padding:9px 15px; border-radius:11px; border:none; background:linear-gradient(135deg,var(--accent),#5b52d9); color:#fff; font-weight:800; font-size:13px; box-shadow:0 6px 16px -8px var(--accent)}
.qbtn.alt{background:var(--card); border:1px solid var(--line); color:var(--text); box-shadow:none}
#tour{position:fixed; bottom:78px; inset-inline:16px; z-index:95; max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:16px 18px; box-shadow:0 14px 40px -12px rgba(0,0,0,.5); display:none}
#tour.show{display:block}
#tour .tstep{font-size:12px; color:var(--accent); font-weight:800; margin-bottom:4px}
#tour .ttitle{font-weight:800; margin-bottom:6px; font-size:16px}
#tour .tbody{font-size:13px; color:var(--muted); margin-bottom:12px}
#tour .btns{display:flex; gap:8px; justify-content:flex-end}

@media(max-width:700px){
  .hrow{flex-wrap:wrap}
  .hsearch{order:3; flex:1 1 100%}
  .tabs{position:static}
  .modal{padding:18px}
  .btn{flex:1 1 100%}
}
</style>
</head>

":"SH-09","tag":"تشغيل","tag_key":"ops","title":"لوحة تجميع السجلات","pointer":"من سجلات متناثرة إلى قصص مفهومة","body":"منصة تجميع وهندسة سجلات تجمع المصادر وتربط الأحداث مع احتفاظ زمني مدروس.","bullets":["ابدأ بالسجلات الحرجة: دخول واتصال وامتلاء","حدّ فترة الاحتفاظ بتكلفة معلنة","ثبّت تنبيهات قليلة ومفيدةفقط"]},{"id":"SH-10","tag":"تشغيل","tag_key":"ops","title":"تصيد وهمي وتدريب دوري","pointer":"قلّل النقرات أكثر من تجهيب رخص","body":"منصة محاكاة تصيد وتدريب تقيس النقرات وترفع التوعية بشهادات تدريب موقونة.","bullets":["أرسل محاكاة شهرية بسياق واقعي","درّب النقرين درباً موجه لا إملاءً","قيس النقرات قبل وبعد كرقماً صريحاً"]},{"id":"SH-11","tag":"تشغيل","tag_key":"ops","title":"منصة إدارة الثغرات","pointer":"من قائمة فحوص إلى مهام مملوكة موعدة","body":"منصة تدير دورة حياة الثغرة: اكتشاف، تقييم، تملك، رقيع، وتحقق إغلاق.","bullets":["لكل ثغرة مالك وموعد لا «لاحقاً»","أرجئ بناء خطة لا بالواقع","اربط الخطورة بقيمة المورد المصاب"]},{"id":"SH-12","tag":"تشغيل","tag_key":"ops","title":"نسخ احتياطي واسترجاع مختبر","pointer":"نسخة لا يُختبر استرجاعها غير موجودة","body":"منصة نسخ احتياطي بعزل عن الإنتاج واختبار استرجاع مثاخر ومنحنى احتفاظ واضح.","bullets":["اعزل نسخ الشبكات عن الاستباق","اختبر استرجاع حقيقي كل فصل","احمِ نسخ الأسبوع من التغرير"]}]},{"key":"flows","type":"cards","icon":"⚙️","color":"#8b5cf6","label_ar":"خطوط الدفاع","label_en":"Defense Pipelines","note":"كل خط دائرة دفاع مكتملة: مدخل موثق، تنفيذ قابل للتكرار، وبوابة تحقق قبل الإغلاق.","cats":{"people":{"label_ar":"أشخاص","color":"#8b5cf6"},"devices":{"label_ar":"أجهزة","color":"#ef4444"},"net":{"label_ar":"شبكة","color":"#0ea5e9"},"ops":{"label_ar":"تشغيل","color":"#2ad3a7"}},"items":[{"id":"DF-01","tag":"أشخاص","tag_key":"people","title":"تعهيد موظف جديد","pointer":"من خانة المنصب إلى قائمة وصول موقعة","body":"الخط: منصب، أدوار، حسابات، تحقق بخطوتين، جهاز مسجل، تدريب نصف ساعة، ثم سجل تعهيد موقّع.","bullets":["أقل وصول يخدم الدور لا أكثر","لا حساب إلا بتحقق بخطوتين من أول يوم","سجل موقّع يستعيد في العودة"]},{"id":"DF-02","tag":"أشخاص","tag_key":"people","title":"تعهد مورّد أو متعاون","pointer":"وصول مؤقت بمدة انتهاء لا بصلاحية دائمة","body":"الخط: نطاق مهمة، وصول محدود، مشاركة أسرار عبر روابط مؤقتة، تاريخ نهاية، ثم إغلاق موثق.","bullets":["متعاون واحد = وصول واحد محدد","تاريخ انتهاء مكتوب بصرياً","راجع التمديدات قبل كل تجديد"]},{"id":"DF-03","tag":"أشخاص","tag_key":"people","title":"إنهاء خدمة موظف","pointer":"بعد البكرة لا يفتح شيئاً","body":"الخط: تعطيل الحسابات، نقل الملكيات، استرجاع الأجهزة، مراجعة صندوق البريد، ثم سجل خروج موقّع.","bullets":["تعطيل فوري بنفس ساعة الإعلان","نقل كل ملكيات قبل يوم الخروج","سجل خروج موقّع من الاثنين"]},{"id":"DF-04","tag":"أجهزة","tag_key":"devices","title":"فحص جهاز مشتبه","pointer":"عزل ثم جمع ثم قرار لا العكس","body":"الخط: عزل الشبكة فوراً، حفظ الذاكرة والسجلات، فحص التشغيل التلقائي، ثم قرار إصلاح أو إعادة ضبط.","bullets":["العزل أول إجراء لا بعد التشخيص","احفظ لقطة الذاكرة قبل الإطفاء","لا أعد الضبط دون سجل مراجعة"]},{"id":"DF-05","tag":"أجهزة","tag_key":"devices","title":"دورة ترقيع شهرية","pointer":"ثغرات مغلقة قبل أي خط آخر","body":"الخط: جرد الإصدارات، ترتيب الخطورة، نشر الترقيع على دفعات، تحقق شامل، ثم تقرير نسبة الاكتمال.","bullets":["ابدأ بالأجهزة المكشوفة على الشبكة","دفعة اختبار ثم ضخامة الفريق","تقرير شهري بنسبة مكتملة مسماة"]},{"id":"DF-06","tag":"شبكة","tag_key":"net","title":"جدولة فرص الثغرات","pointer":"مسح منتظم ثم مهلياً إصلاح مصنفة","body":"الخط: مسح مبرمج، تصنيف الخطورة، مهلة إصلاح لكل درجة، تعطيل الأغراض المؤجلة تتجاوز.","bullets":["حرجة في أيام، عالية في أيام أسبوع","المؤجلة تنتقل بقرار معلق موقّع","أعد المسح فارغاً قبل الغلق"]},{"id":"DF-07","tag":"شبكة","tag_key":"net","title":"استجابة حدث اختراق","pointer":"مدة بقاء قبل الاكتشاف = مقياس خطير","body":"الخط: إبلاغ، احتواء، إبعاد النفاذ، تحليل مصدر، إصلاح، توثيق، ثم درس مكتوب لإغلاق الحالة.","bullets":["لا أهيكل التحقيق قبل الاحتواء","كل خطوة بمذيّل زمني أدوات ، وقائد مذكور","تلخيص دروس في صفحة واحدة"]},{"id":"DF-08","tag":"شبكة","tag_key":"net","title":"مراجعة أذونات كل فصل","pointer":"من بصم الأنظمة إلى صفر أمتية","body":"الخط: تصدير أذونات إجمالية، مقارنة بالأدوار، إزالة الوصول الغريب، التوقيع ثم إعلان النتيجة.","bullets":["فرق التجريب والمتعاونين أولى","امنع تكرار الوصول بلا مالك","نشر فوج الوصول النظيف"]},{"id":"DF-09","tag":"تشغيل","tag_key":"ops","title":"اختبار سرّية النسخ","pointer":"استرجاع مختبر = نسخة حقيقية","body":"الخط: اختيار نسخ، استرجاع في بيئة معزولة، قياس الزمن، فحص البيانات، إنهاء وتوثيق نتيجة.","bullets":["اختبار في بيئة لا الإنتاج","قياس الزمن دقيقة لا تقديراً","توقيع للاختبار في السجل"]},{"id":"DF-10","tag":"تشغيل","tag_key":"ops","title":"تصيد وهمي شهري","pointer":"نقرات قلّت في المقياس = نجاح","body":"الخط: بناء سيناريو واقعي، إرسال محاكاة، قيس النقرات والتقارير، تدريب موجّه، ثم تكرار شهرية.","bullets":["أرسل لواحد حتى لا يمتحد التدريب","علم التقرير الفوري بدون تأنيب","أعلن مقياس الشهر في اجتماع"]}]},{"key":"contracts","type":"cards","icon":"📜","color":"#f0b429","label_ar":"عقود الدفاع","label_en":"Defense Contracts","note":"كل عقد هدف واحد، قواعد مرتبة، ومخرج ثابت — انسخه واملأ {{المتغير}} فحسب.","cats":{"report":{"label_ar":"تقارير","color":"#ef4444"},"plan":{"label_ar":"خطط","color":"#0ea5e9"},"access":{"label_ar":"وصول","color":"#8b5cf6"},"ops":{"label_ar":"تشغيل","color":"#2ad3a7"}},"items":[{"id":"DC-01","tag":"تقارير","tag_key":"report","title":"عقد تقرير ثغرة","pointer":"درجة، دليل، رقعة، موعد، ومالك","body":"الهدف: وثّق الثغرة {{اسم الثغرة}} على {{النظام}}.\n【القواعد】 درجة الخطورة بمقياس معلن، ودليل إعادة الإنتاج خطوة بخطوة.\n【المخرج】 تقرير صفحة: درجة، دليل، خطة رقيع، موعد، ومالك موقّع."},{"id":"DC-02","tag":"تقارير","tag_key":"report","title":"عقد تقرير حادث","pointer":"خلية زمنية: قبل، أثناء، بعد","body":"الهدف: حوصلي حادث {{التاريخ}} وفق منهج موحّد.\n【القواعد】 خط زمني دقيق، نطاق الأثر، الإجراءات، والدرس المكتوب.\n【المخرج】 تقرير صفحة: خيوط، أثر، إجراءات، دروس، وتوصيات معلقها."},{"id":"DC-03","tag":"وصول","tag_key":"access","title":"عقد مصفوفة وصول","pointer":"دور لكل عمود، مورد لكل صف دل دفع ثمن حادث واحد."},{"key":"policy","type":"checklist","icon":"🛡️","color":"#ef4444","label_ar":"سياسة الدفاع","label_en":"Defense Policy","note":"وجه التحقيق قبل تفعيل أي بند: الاعتماد أولاً ثم التفعيل، وكل رفض يوثَّق سببه.","items":[{"id":"SP-01","text":"تحقق بخطوتين إجباري لا استثناء يوافق عليه سواك","risk":"high"},{"id":"SP-02","text":"أقل صلاحية لكل حساب: الدور يحدد الوصول لا الشخص","risk":"high"},{"id":"SP-03","text":"كل الأسرار والمفاتيح في خزنة واحدة بلا ميزة نفق","risk":"high"},{"id":"SP-04","text":"منع مشاركة الحسابات وكلمات المرور حتى الفريق الحاكم","risk":"high"},{"id":"SP-05","text":"تدوير المفاتيح والكلمات السرية وفق جدول مكتوب","risk":"high"},{"id":"SP-06","text":"كل جهاز مسجل ومحمي ومحدّث قبل وصله ببيانات العمل","risk":"high"},{"id":"SP-07","text":"نسخ احتياطي معطل الخدمة مع اختبار استرجاع موثق","risk":"high"},{"id":"SP-08","text":"تشفير الأقراص للمحمول والحالات المفقودة موضوعياً","risk":"high"},{"id":"SP-09","text":"جدار نار مرفوض افتراضياً وكل قاعدة فتح مسألة سبب ورقم صادر","risk":"med"},{"id":"SP-10","text":"مذكرة إجراء حادث مكتوبة فترادة: من يحتوي من يبلغ متى","risk":"high"},{"id":"SP-11","text":"كل حادث عنصر حادثة موثقة ودرس مشترك بعد التنفيذ","risk":"med"},{"id":"SP-12","text":"ترقيع دوري: مهلة معلنة لكل درجة خطورة لا اجتهاد شخصي","risk":"high"},{"id":"SP-13","text":"مسح ثغرات مبرمج بجواب مرحوم لا مزيّف عموري","risk":"med"},{"id":"SP-14","text":"اختبار اختراق خارجي سنوي لولات جديد أو تغيير جوهري","risk":"med"},{"id":"SP-15","text":"محاكاة تصيد شهرية قياسًا لا تشيئماً وتدريب بلا مؤابث","risk":"med"},{"id":"SP-16","text":"مراجهة أذونات كل فصل مع إزالة المغادرين والعقود المنتهية","risk":"med"},{"id":"SP-17","text":"شرط أمان مكتوب في كل عقد مورد يدير بيانات المؤشر","risk":"med"},{"id":"SP-18","text":"مراجعة سياسة الدفاع كل فصل مع توقيع تغييرها لا فتلها","risk":"low"}]}]};
const SLUG = "aodshieldos";
const ST = k => "aos_" + SLUG + "_" + k;
const S = { get(k,d){ try{ const v = JSON.parse(localStorage.getItem(ST(k))); return v===null?d:v; }catch(e){ return d; } }, set(k,v){ localStorage.setItem(ST(k), JSON.stringify(v)); } };
let lang = "ar";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function say(msg){ const el = document.getElementById("toast"); el.textContent = msg; clearTimeout(el._t); el.style.transform = "translateX(-50%) translateY(0)"; el._t = setTimeout(()=>{ el.style.transform = "translateX(-50%) translateY(80px)"; }, 1800); }
async function copyText(txt, msg){ try{ await navigator.clipboard.writeText(txt); }catch(e){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); } say(msg); }
const L = (o) => lang === "ar" ? (o.ar || o.label_ar || "") : (o.en || o.label_en || o.label_ar || "");

/* tabs */
let active = null, q = "";
function renderTabs(){
  document.getElementById("tabs").innerHTML = DATA.tabs.map(s =>
    `<button class="tchip ${active===s.key?"on":""}" style="--tc:${s.color||"var(--accent)"}" data-key="${s.key}"><span class="dot"></span>${esc(s.icon)} ${esc(L(s))}</button>`).join("");
  document.querySelectorAll("#tabs .tchip").forEach(b=>b.onclick=()=>{ active = b.dataset.key; document.getElementById("q").value=""; q=""; location.hash = active; renderTabs(); renderSection(); });
}

/* generic : counts in hero */
function statChips(){
  const rows = t => ({cards:t.items||[], roadmap:t.days||[], kanban:t.items||[], table:t.rows||[], calc:t.fields||[], checklist:t.items||[]}[t.type] || []);
  return DATA.tabs.slice(0,5).map(t=>`<div class="stat"><b>${rows(t).length}</b> ${esc(L(t))}</div>`).join("");
}

/* search */
function hayOf(o){ return o.id ? o.id+" "+[...Object.values(o)].flat().join(" ") : Object.values(o).join(" "); }
function hit(o){ return !q || hayOf(o).toLowerCase().includes(q.toLowerCase()); }

/* renderers */
function rCards(tab){
  const cats = tab.cats || null, cat = S.get("cat_"+tab.key, "all");
  const host = document.getElementById("sec-"+tab.key);
  host.innerHTML = "";
  if(tab.note){ const nb=document.createElement("div"); nb.className="notebox"; nb.innerHTML=`<b>تنبيه:</b> ${esc(tab.note)}`; host.appendChild(nb); }
  let bar = null;
  if(cats){
    bar = document.createElement("div"); bar.className = "bar";
    bar.innerHTML = ["all",...Object.keys(cats)].map(k=>`<button class="bchip ${cat===k?"on":""}" style="--ac:${k==="all"?"var(--accent)":cats[k].color}">${k==="all"?"الكل":esc(cats[k].label_ar)}</button>`).join("");
    const each = bar.querySelectorAll(".bchip");
    each.forEach((b,i)=>b.onclick=()=>{ S.set("cat_"+tab.key, ["all",...Object.keys(cats)][i]); each.forEach(x=>x.classList.remove("on")); b.classList.add("on"); fill(); });
    host.appendChild(bar);
  }
  const g = document.createElement("div"); g.className = "grid"; g.style.paddingBottom = "30px"; host.appendChild(g);
  function list(){ const items = tab.items.filter(x=>cat==="all"||x.tag_key===cat||!x.tag_key).filter(hit); return items; }
  function cardHTML(items){
    if(!items.length) return `<div class="empty">لا نتائج مطابقة — جرّب كلمات أخرى.</div>`;
    return items.map(it=>{
      const c = tab.cats && tab.cats[it.tag_key] ? tab.cats[it.tag_key].color : "#7b6cff";
      return `<article class="card hov" data-id="${it.id}">
        <div class="top"><span class="pid">${it.id}</span><span class="badge" style="background:${c}">${esc(it.tag=="null"?"":(it.tag||""))}</span></div>
        <h3>${esc(it.title)}</h3>
        <p>${esc(it.pointer||"")}</p>
        <div class="foot"><span class="mini">${(it.bullets||[]).length} نقاط</span><span class="ghostbtn act-cp" data-id="${it.id}">📋 نسخ</span></div>
      </article>`;}).join("");
  }
  function bind(){
    g.querySelectorAll(".card").forEach(c=>c.onclick=e=>{
      const id = c.dataset.id; const it = tab.items.find(x=>x.id===id); if(!it) return;
      if(e.target.closest(".act-cp")){ const it2 = tab.items.find(x=>x.id===id);
        copyText(it2.title+" ("+it2.id+")\n"+it2.body+"\n"+(it2.bullets||[]).map(b=>"• "+b).join("\n")+"\nإتقان: "+(it2.pointer||""), "تم النسخ ✓"); e.stopPropagation(); return; }
      openCard(it, tab);
    });
  }
  function fill(){ g.innerHTML = cardHTML(list()); bind(); }
  fill();
}
function openCard(it, tab){
  const c = (tab.cats && tab.cats[it.tag_key]) || null;
  document.getElementById("modal").innerHTML = `
    <div class="mhead"><div><div class="mtagrow">${c?`<span class="mbadge" style="background:${c.color}">${esc(c.label_ar)}</span>`:""}<span class="mbadge" style="background:var(--card2); color:var(--muted); border:1px solid var(--line)">${it.id}</span></div><h2>${esc(it.title)}</h2></div><button class="x" id="mx">✕</button></div>
    <div class="sec"><h4>التفصيل</h4><div class="box">${esc(it.body)}</div></div>
    ${(it.bullets||[]).length?`<div class="sec"><h4>النقاط التنفيذية</h4><div class="box">${esc(it.bullets.map(b=>"• "+b).join("\n"))}</div></div>`:""}
    ${it.pointer?`<div class="sec"><h4>إشارة الإتقان</h4><div class="box">${esc(it.pointer)}</div></div>`:""}
    <div class="btnrow"><button class="btn" id="mCopy">📋 نسخ الكل</button></div>`;
  document.getElementById("overlay").classList.add("open");
  document.getElementById("mx").onclick = closeModal;
  document.getElementById("mCopy").onclick = ()=>copyText(it.title+"\n"+it.body+"\n"+(it.bullets||[]).map(b=>"• "+b).join("\n")+"\n"+(it.pointer||""), "تم النسخ ✓");
}
function closeModal(){ document.getElementById("overlay").classList.remove("open"); }
document.getElementById("overlay").onclick = e=>{ if(e.target.id==="overlay") closeModal(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

function rRoadmap(tab){
  const done = S.get("rm_"+tab.key, []);
  const host = document.getElementById("sec-"+tab.key);
  const pct = Math.round(done.length / tab.days.length * 100);
  host.innerHTML = `<div class="progwrap"><div class="plabel"><span><b>تقدمك في الخطة:</b></span><span>${done.length}/${tab.days.length} (${pct}%)</span></div><div class="prog"><i style="width:${pct}%"></i></div></div>
  ${tab.note?`<div class="notebox"><b>تنبيه:</b> ${esc(tab.note)}</div>`:""}
  <div class="tl">${tab.days.filter(hit).map(r=>`
    <div class="tlrow" style="grid-template-columns:64px 130px 1fr auto">
      <b style="color:var(--ytcolor,${tab.color||"var(--accent)"})">يوم ${r.day}</b>
      <span style="font-size:13px">${esc(r.focus)}</span>
      <span style="font-size:13.5px">${esc(r.action)}<br><span class="mini">المؤشر: ${esc(r.kpi)}</span></span>
      <button class="ghostbtn act-rm" data-d="${r.day}" ${done.includes(r.day)?'style="border-color:var(--accent2); color:var(--accent2)"':""}>${done.includes(r.day)?"✓ مُنجز":"تسجيل إنجاز"}</button>
    </div>`).join("")}</div>`;
  host.querySelectorAll(".act-rm").forEach(b=>b.onclick=()=>{
    const d = +b.dataset.d; const a = S.get("rm_"+tab.key, []); const i = a.indexOf(d);
    if(i>=0) a.splice(i,1); else a.push(d);
    S.set("rm_"+tab.key, a); rRoadmap(tab); say(a.includes(d)?"سُجّل الإنجاز ✓":"أُلغي الإنجاز");
  });
}

function rKanban(tab){
  const moves = S.get("kb_"+tab.key, {});
  const items = tab.items.map(it=>({ ...it, col: moves[it.id] || it.col }));
  const host = document.getElementById("sec-"+tab.key);
  host.innerHTML = `${tab.note?`<div class="notebox"><b>تنبيه صناعي هام:</b> ${esc(tab.note)}</div>`:""}
  ${tab.extraNote&&!tab.extraNote2?"" : ""}<div class="kanban">${tab.columns.map(col=>{
    const cls = tab.items.filter(x=>(moves[x.id]||x.col)===col.key);
    return `<div class="kcol"><h4><span style="color:${col.color}">${esc(L(col))}</span><span class="cnt">${cls.filter(hit).length}</span></h4>
    ${cls.filter(hit).map(it=>`<div class="kitem"><b>${esc(it.title)}</b><br><span class="mini">${esc(Object.values(it.fields||{}).join(" · "))}</span>
      <div class="kmove"><button data-id="${it.id}" data-d="-1">→ الرجوع</button><button data-id="${it.id}" data-d="1">التقدم ←</button></div></div>`).join("")}</div>`;}).join("")}</div>`;
  host.querySelectorAll(".kmove button").forEach(b=>b.onclick=()=>{
    const id = b.dataset.id; const it = tab.items.find(x=>x.id===id);
    const cols = tab.columns.map(c=>c.key);
    const cur = moves[id] || it.col;
    const ni = Math.max(0, Math.min(cols.length-1, cols.indexOf(cur) + (+b.dataset.d)));
    moves[id] = cols[ni]; S.set("kb_"+tab.key, moves); rKanban(tab); say("تحديث الحالة ✓");
  });
}

function rTable(tab){
  const host = document.getElementById("sec-"+tab.key);
  const cols = tab.columns;
  const rows = tab.rows.filter(hit);
  host.innerHTML = (tab.note?`<div class="notebox"><b>تنبيه:</b> ${esc(tab.note)}</div>`:"") + hostsTable(cols, rows, tab);
}
function hostsTable(cols, rows, tab){
  return `<div class="tl" style="max-width:980px">
    <div class="tlrow tlhead" style="grid-template-columns:70px ${cols.map(()=>"1fr").join(" ")}">
      <span>ID</span>${cols.map(c=>`<span>${esc(L(c))}</span>`).join("")}</div>
    ${rows.length?rows.map(r=>`<div class="tlrow" style="grid-template-columns:70px ${cols.map(()=>"1fr").join(" ")}">
      <span class="pid">${r.id||"—"}</span>${cols.map(c=>{ const v = r[c.key]; const vv = Array.isArray(v)?v.join(" · "):v;
        return `<span style="font-size:13px">${esc(String(vv??"—"))}</span>`;}).join("")}</div>`).join("")
      : `<div class="empty">لا نتائج مطابقة.</div>`}
  </div><div style="height:30px"></div>`;
}

function rCalc(tab){
  const host = document.getElementById("sec-"+tab.key);
  const vals = S.get("calc_"+tab.key, {});
  const F = tab.fields;
  const fn = new Function('return (' + tab.formula_js + ')')();
  host.innerHTML = `<div class="anbox"><h3>🧮 ${esc(L(tab))}</h3>
    ${F.map(f=>`<div class="row"><label>${esc(L(f))}</label><input type="number" step="${f.step||"0.01"}" data-k="${f.key}" value="${(function(){ const stored = S.get("calc_"+tab.key+"_"+f.key, null); return stored===null||stored===""?(f.def ?? 0):stored; })()}"></div>`).join("")}
    <div class="ares" id="calcRes"></div>
    <small class="mini" style="display:block;margin-top:8px">${esc(tab.note||"")}</small></div>
    <div class="anbox"><h3>📊 ${esc(tab.formulaNote2Title||"تفصيل الصيغة")}</h3><div class="box" style="font-size:13.5px">${esc(tab.formulaNote||"")}</div></div>`;
  function calc(){
    const v = {};
    host.querySelectorAll("input[data-k]").forEach(i=>{ v[i.dataset.k] = +i.value || 0; S.set("calc_"+tab.key+"_"+i.dataset.k, i.value); });
    let out = "";
    try { out = fn(v) || ""; } catch(e){ out = ""; }
    document.getElementById("calcRes").innerHTML = out;
  }
  host.querySelectorAll("input[data-k]").forEach(i=>["input","change"].forEach(ev=>i.addEventListener(ev, calc)));
  calc();
}

function rChecklist(tab){
  const host = document.getElementById("sec-"+tab.key);
  const checks = S.get("ck_"+tab.key, []);
  const list = tab.items.filter(hit);
  const pct = Math.round(checks.length/tab.items.length*100);
  host.innerHTML = `<div class="progwrap"><div class="plabel"><span><b>الاكتمال:</b></span><span>${checks.length}/${tab.items.length} (${pct}%)</span></div><div class="prog"><i style="width:${pct}%"></i></div></div>
  ${tab.note?`<div class="notebox"><b>تنبيه:</b> ${esc(tab.note)}</div>`:""}
  ${list.map(it=>{ const on = checks.includes(it.id); const rc = it.risk==="high"?"var(--danger)":it.risk==="med"?"var(--warn)":"var(--accent2)";
    return `<label class="ckitem ${on?"done":""}"><input type="checkbox" data-id="${it.id}" ${on?"checked":""}>
      <span class="riskdot" style="background:${rc}"></span><span class="txt">${esc(it.text)}</span>
      <button class="ghostbtn act-ckcopy" data-id="${it.id}">📋</button></label>`; }).join("")}
  <div style="height:30px"></div>`;
  host.querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{
    const a = S.get("ck_"+tab.key, []); const i = a.indexOf(c.dataset.id);
    if(i>=0) a.splice(i,1); else a.push(c.dataset.id);
    S.set("ck_"+tab.key, a); rChecklist(tab);
  });
  host.querySelectorAll(".act-ckcopy").forEach(b=>b.onclick=()=>{
    const it = tab.items.find(x=>x.id===b.dataset.id);
    copyText(it.id+": "+it.text, "تم النسخ ✓");
  });
}

function renderSection(){
  document.querySelectorAll(".sect").forEach(s=>s.classList.toggle("on", s.id==="sec-"+active));
  const tab = DATA.tabs.find(t=>t.key===active); if(!tab) return;
  if(tab.type==="cards") rCards(tab);
  if(tab.type==="roadmap") rRoadmap(tab);
  if(tab.type==="kanban") rKanban(tab);
  if(tab.type==="table") rTable(tab);
  if(tab.type==="calc") rCalc(tab);
  if(tab.type==="checklist") rChecklist(tab);
}

function buildSections(){
  document.getElementById("sections").innerHTML = DATA.tabs.map(s=>
    `<section class="sect" id="sec-${s.key}">${s.type==="cards"?`<div class="grid" id="grid-${s.key}"></div>`:""}</section>`).join("");
}

/* quickbar */
function renderQuickbar(){
  document.getElementById("quickbar").innerHTML = `<div class="wrap">
    <button class="qbtn" data-qa="exp">📦 تصدير بياناتي (JSON)</button>
    <button class="qbtn alt" data-qa="tour">🎯 دليل الاستخدام</button>
    <button class="qbtn alt" data-qa="cnote">🔒 حفظ نسخة محلية</button></div>`;
  const map = {
    exp(){ const mine = {};
      DATA.tabs.forEach(t=>{ const r = S.get("rm_"+t.key, []); if(r.length) mine[t.key+"_doneDays"] = r;
        const ck = S.get("ck_"+t.key, []); if(ck.length) mine[t.key+"_checks"] = ck;
        const kb = S.get("kb_"+t.key, {}); if(Object.keys(kb).length) mine[t.key+"_moves"] = kb; });
      copyText(JSON.stringify({product:DATA.meta.product, exported_at:new Date().toISOString(), mine}, null, 2), "نُسخ التصدير ✓");
    },
    tour(){ tourStep = 0; renderTour(); },
    cnote(){ say("الحفظ محلي تلقائي — لا خوادم ✓"); }
  };
  document.querySelectorAll("#quickbar .qbtn").forEach(b=>b.onclick=()=>map[b.dataset.qa]());
}

/* tour */
let tourStep = 0;
function renderTour(){
  const st = DATA.tabs;
  const s = st[tourStep] || null;
  if(!s){ endTour(); return; }
  active = s.key; renderTabs(); renderSection();
  const el = document.getElementById("tour");
  const body = s.tour ? L(s.tour) : (lang==="ar" ? `ستّكشف في هذا التبويب سجلات جاهزة مملوءة — لا قوالب فارغة. ابحث في الأعلى، انسخ ما يناسبك مباشرة.` : `Filled records — no empty templates. Search, open, copy.`);
  el.innerHTML = `<div class="tstep">${lang==="ar"?"خطوة":"Step"} ${tourStep+1}/${st.length}</div>
    <div class="ttitle">${esc(s.icon)} ${esc(L(s))}</div>
    <div class="tbody">${esc(body)}</div>
    <div class="btns"><button class="ghostbtn" id="tSkip">${lang==="ar"?"تخطي":"Skip"}</button>
    ${tourStep>0?`<button class="ghostbtn" id="tPrev">${lang==="ar"?"السابق":"Prev"}</button>`:""}
    <button class="qbtn" id="tNext">${tourStep===st.length-1?(lang==="ar"?"انطلق ✓":"Go ✓"):(lang==="ar"?"التالي":"Next")}</button></div>`;
  el.classList.add("show");
  document.getElementById("tSkip").onclick = endTour;
  const p = document.getElementById("tPrev"); if(p) p.onclick = ()=>{ tourStep--; renderTour(); };
  document.getElementById("tNext").onclick = ()=>{ if(tourStep===st.length-1) return endTour(); tourStep++; renderTour(); };
}
function endTour(){ document.getElementById("tour").classList.remove("show"); S.set("tourDone", true); }

/* boot */
(function(){
  const m = DATA.meta;
  document.title = m.product + " — Aodı Akdıro";
  document.getElementById("brandTitle").innerHTML = esc(m.brandShort || "Aodı Akdıro") + `<small>${esc(m.subtitle || "")}</small>`;
  document.getElementById("heroTitle").innerHTML = `<span class="grad">${esc(m.product)}</span>`;
  document.getElementById("heroSub").textContent = m.tagline_ar || "";
  document.getElementById("heroStats").innerHTML = statChips();
  document.getElementById("fBrand").innerHTML = `${esc(m.product)} v${m.version}<span id="fDate">· Build ${m.build_date}</span>`;
  document.documentElement.style.setProperty("--accent", m.accent || "var(--accent)");
  if(m.accent) document.documentElement.style.setProperty("--accent", m.accent);
  document.getElementById("q").addEventListener("input", e=>{ q = e.target.value.trim(); renderSection(); });
  document.getElementById("langBtn").onclick = ()=>{
    lang = lang==="ar" ? "en" : "ar";
    document.documentElement.lang = lang; document.documentElement.dir = lang==="ar"?"rtl":"ltr";
    document.getElementById("langBtn").textContent = lang==="ar"?"EN":"AR";
    document.getElementById("heroSub").textContent = lang==="ar" ? (m.tagline_ar||"") : (m.tagline_en || m.tagline_ar || "");
    document.getElementById("q").placeholder = lang==="ar"?"ابحث في كل الوحدات…":"Search all units…";
    const tabsEl = document.getElementById("tabs"); if(tabsEl) renderTabs();
    renderTabs(); renderSection();
  };
  document.getElementById("themeBtn").onclick = ()=>{
    const h = document.documentElement;
    h.setAttribute("data-theme", h.getAttribute("data-theme")==="light" ? "dark" : "light");
  };
  document.getElementById("replayTour").onclick = e=>{ e.preventDefault(); tourStep = 0; renderTour(); };
  buildSections(); renderTabs(); renderSection(); renderQuickbar();
  const urlTab = new URLSearchParams(location.search).get("tab") || decodeURIComponent(location.hash.replace("#",""));
  active = DATA.tabs.some(t=>t.key===urlTab) ? urlTab : DATA.tabs[0].key;
  renderTabs(); renderSection();
  if(!urlTab && !S.get("tourDone", false)) startTourSafe();
  window.addEventListener("hashchange", ()=>{ const h = decodeURIComponent(location.hash.replace("#","")); if(DATA.tabs.some(t=>t.key===h)){ active = h; renderTabs(); renderSection(); } });
})();
function startTourSafe(){ try{ renderTour(); }catch(e){ console.warn(e); } }
</script>
</body>
</html>
